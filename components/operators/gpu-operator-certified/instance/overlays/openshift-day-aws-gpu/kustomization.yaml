# OpenShift Day AWS GPU overlay
#
# Provisions g6e instances (NVIDIA L40S GPU) via MachineSet.
# Default: 1 replica, autoscale min 1 / max 4.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

components:
  - ../../components/openshift-day-aws-gpu-machineset
  - ../../components/schedule-on-tainted-nodes
