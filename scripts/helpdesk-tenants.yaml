  - name: helpdesk-email-triage-demo
    repoURL: https://github.com/GeraldSP/ai-accelerator-tenants.git
    targetRevision: main
    path: helpdesk-email-triage-demo/namespaces/overlays/summit-connect-chile

  - name: aiops-sandboxed-agent-fleet
    repoURL: https://github.com/GeraldSP/ai-accelerator-tenants.git
    targetRevision: main
    path: aiops-sandboxed-agent-fleet/namespaces/overlays/summit-connect-chile
